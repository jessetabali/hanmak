upstream hanmak_backend {
    server backend:8000;
}

upstream hanmak_frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django API, admin and DRF auth
    location ~ ^/(api|admin|api-auth)/ {
        proxy_pass http://hanmak_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO media files — proxy through Nginx so the browser uses the same
    # origin (localhost:8080) and no CORS configuration is required.
    # /files/{key} → minio:9000/hanmak/{key}
    location /files/ {
        proxy_pass http://minio:9000/hanmak/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Authorization "";
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Vanilla JS beta reference app. Keep this route available until the React
    # frontend passes the mock-removal checklist.
    location = /mock {
        return 301 /mock/;
    }

    location /mock/ {
        alias /app/mock/;
        index index.html;
        try_files $uri $uri/ /mock/index.html;
    }

    # Vite dev server — includes WebSocket upgrade for HMR
    location / {
        proxy_pass http://hanmak_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
