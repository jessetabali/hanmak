<script>
  // Initialize on load
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof updateTopbarAuthButton === 'function') updateTopbarAuthButton();
    if (typeof updateOfflineBanner === 'function') updateOfflineBanner();
    if (typeof hydrateOrganizationChrome === 'function') hydrateOrganizationChrome();
    if (typeof hydrateShellChrome === 'function') hydrateShellChrome();
    const params = new URLSearchParams(location.search);
    const page = params.get('page');
    const token = params.get('token');
    if (page) navigate(page);
    else if (!token) navigate('dashboard');
  });
</script>
